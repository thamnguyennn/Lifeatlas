    <script>
      // Restore the saved look before first paint so there is no flash.
      try {
        var t = localStorage.getItem("atlas-theme");
        if (t === "night" || t === "parchment") document.documentElement.setAttribute("data-skin", t);
      } catch (e) {}
    </script>
